name: Install Source and Deploy Live

on:
  push:
    branches:
      - main
    paths:
      - "src.zip"

permissions:
  contents: write

jobs:
  install-build-deploy:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # CHECKOUT SOURCE REPOSITORY
      # ======================================================

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # SAVE UPLOADED ZIP
      # ======================================================

      - name: Save src.zip
        run: |
          cp src.zip /tmp/src.zip

      # ======================================================
      # ERASE OLD SOURCE
      # Preserve:
      #   .git
      #   .github
      # ======================================================

      - name: Erase old source
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

      # ======================================================
      # EXTRACT NEW SOURCE
      # If ZIP contains one outer folder, remove that level.
      # ======================================================

      - name: Extract src.zip
        run: |
          rm -rf /tmp/extracted
          mkdir -p /tmp/extracted

          unzip -q /tmp/src.zip -d /tmp/extracted

          ITEM_COUNT=$(find /tmp/extracted -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$ITEM_COUNT" -eq 1 ]; then
            ONLY_ITEM=$(find /tmp/extracted -mindepth 1 -maxdepth 1)

            if [ -d "$ONLY_ITEM" ]; then
              echo "Single outer directory detected."
              echo "Copying its contents into repository root."

              cp -a "$ONLY_ITEM"/. .
            else
              cp -a /tmp/extracted/. .
            fi
          else
            echo "Multiple top-level items detected."
            cp -a /tmp/extracted/. .
          fi

      # ======================================================
      # CLEAN UP ZIP
      # ======================================================

      - name: Remove src.zip
        run: |
          rm -f src.zip
          rm -f /tmp/src.zip
          rm -rf /tmp/extracted

      # ======================================================
      # NODE / VITE BUILD
      # ======================================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite site
        run: npm run build

      # ======================================================
      # COMMIT CLEAN SOURCE BACK TO SOURCE REPOSITORY
      # ======================================================

      - name: Commit source replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Install source from src.zip"
            git push origin main
          fi

      # ======================================================
      # CONFIGURE SSH FOR LIVE REPOSITORY
      #
      # LIVE_DEPLOY_REPO contains the private SSH key.
      # Matching public key is the read/write SSHACTIONS
      # deploy key on website--financial--snapshot.
      # ======================================================

      - name: Configure live deploy SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIVE_DEPLOY_REPO }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519

          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # ======================================================
      # DEPLOY DIST TO LIVE REPOSITORY
      # ======================================================

      - name: Deploy to live repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/deploy

          git clone \
            git@github.com:NateNeuhaus/website--financial-snapshot.git \
            /tmp/deploy

          # Delete everything in live repo except its .git folder
          find /tmp/deploy -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

          # Copy Vite production build into live repo root
          cp -a dist/. /tmp/deploy/

          cd /tmp/deploy

          git add -A

          if git diff --cached --quiet; then
            echo "No live changes to deploy."
          else
            git commit -m "Deploy Vite site"
            git push origin main
          fi
